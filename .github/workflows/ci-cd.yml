name: CI/CD Pipeline - MarkZap

on:
  push:
    branches: [main, production]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================
  # JOB 1: SECURITY SCANNING
  # ========================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: npm audit (Critical vulnerabilities)
        run: |
          echo "🔍 Running npm audit..."
          npm audit --audit-level=critical || true
          if [ $? -ne 0 ]; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi

      - name: Secret Scanning
        uses: git-secrets/git-secrets@master
        with:
          repository-path: .
        continue-on-error: true

      - name: Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          format: 'sarif'
          output: 'trivy-results.sarif'
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: OWASP Dependency Check
        run: |
          echo "🔍 Checking dependencies..."
          # Add SCA scanning here
          npm run security-check || exit 1

      - name: CodeQL Analysis (SAST)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

      - name: Container Security Scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  # ========================================
  # JOB 2: BUILD & TEST
  # ========================================
  build:
    name: Build & Test
    needs: security
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          security-opt: |
            label=disable
          sbom: true

      - name: Export SBOM
        if: github.event_name != 'pull_request'
        run: |
          docker save ${{ steps.meta.outputs.tags }} -o image.tar
          syft packages -i image.tar -o cyclonedx-json > sbom.json
          mkdir -p artifacts
          cp sbom.json artifacts/
          tar -czf artifacts/build_${{ github.sha }}.tar.gz public/

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/

  # ========================================
  # JOB 3: DEPLOY TO STAGING
  # ========================================
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.markzap.online

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init (Staging)
        run: |
          cd terraform/environments/staging
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform/environments/staging
          terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd terraform/environments/staging
          terraform apply -auto-approve tfplan

      - name: Deploy to Vercel Staging
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.STAGING_PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.ORG_ID }}
          production: false
          fork: false

      - name: Run smoke tests on staging
        run: |
          echo "🧪 Testing staging deployment..."
          sleep 30
          curl -f https://staging.markzap.online/health || exit 1
          echo "✅ Staging is healthy"

  # ========================================
  # JOB 4: DEPLOY TO PRODUCTION (Manual)
  # ========================================
  deploy-prod:
    name: Deploy to Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://markzap.online

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init (Production)
        run: |
          cd terraform/environments/production
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform/environments/production
          terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/production'
        run: |
          cd terraform/environments/production
          terraform apply -auto-approve tfplan

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.ORG_ID }}
          production: true
          fork: false

      - name: Post-deployment tests
        run: |
          echo "🚀 Running post-deployment verification..."
          sleep 60  # Wait for CDN propagation
          # Health check
          curl -f https://markzap.online/health || exit 1
          # Check homepage
          curl -f https://markzap.online || exit 1
          # Security headers check
          curl -sI https://markzap.online | grep -q "X-Frame-Options" || exit 1
          curl -sI https://markzap.online | grep -q "Strict-Transport-Security" || exit 1
          echo "✅ Production deployment successful!"

      - name: Notify deployment success
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: "Production deployment ${{ job.status }} for MarkZap"

  # ========================================
  # JOB 5: BACKUP & DISASTER RECOVERY
  # ========================================
  backup:
    name: Backup & Snapshot
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Create backup archive
        run: |
          tar -czf markzap-backup-${{ github.sha }}.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='backup' \
            --exclude='temp' \
            .

      - name: Upload to S3 backup bucket
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          aws s3 cp markzap-backup-${{ github.sha }}.tar.gz \
            s3://markzap-backups/production/${{ github.sha }}/ \
            --storage-class STANDARD_IA

      - name: Create RDS snapshot
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          aws rds create-db-snapshot \
            --db-instance-identifier markzap-prod-db \
            --db-snapshot-identifier markzap-snapshot-${{ github.sha }}

      - name: Backup verification
        run: |
          echo "✅ Backup completed for build ${{ github.sha }}"

  # ========================================
  # JOB 6: MONITORING & ALERTS
  # ========================================
  monitor:
    name: Monitoring & Alerts
    needs: [deploy-prod, backup]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Configure monitoring
        run: |
          echo "📊 Updating monitoring dashboards..."
          # Deploy Grafana dashboards
          # Update alert rules
          curl -X POST http://grafana/api/dashboards/db -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" -d @monitoring/grafana/dashboards/markzap.json

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          # Test critical endpoints
          curl -f https://markzap.online/health || exit 1
          curl -f https://markzap.online/ || exit 1
          # Test API if exists
          # curl -f https://api.markzap.online/health || exit 1

      - name: Verify SSL certificate
        run: |
          echo "🔒 Checking SSL certificate..."
          # Use SSL Labs API or similar
          echo "SSL check would run here"

      - name: Send deployment notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: |
            🚀 MarkZap Deployment Summary:
            - Build: ${{ github.sha }}
            - Branch: ${{ github.ref }}
            - Status: ${{ job.status }}
            - URL: https://markzap.online
            - Dashboard: https://grafana.markzap.online
            - Logs: https://logs.markzap.online
