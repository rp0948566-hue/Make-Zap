name: Deploy to Vercel
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Scan
        run: |
          echo "🔍 Running security checks..."
          npx npm audit --audit-level moderate || true
          node scripts/security-check.js || exit 1

      - name: Lint Code
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.ORG_ID }}
          production: true
          fork: false

  test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for deployment to be live..."
          sleep 30
      - name: Smoke test
        run: |
          curl -f https://markzap.online/health || exit 1
          curl -f https://markzap.online || exit 1
          echo "✅ Site is healthy"
