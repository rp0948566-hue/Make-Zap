server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: markzap-app
  static_configs:
  - targets:
      - localhost
    labels:
      job: markzap-app
      __path__: /var/log/app/*.log
      service: markzap
      environment: production

- job_name: nginx
  static_configs:
  - targets:
      - localhost
    labels:
      job: nginx
      __path__: /var/log/nginx/*.log
      service: nginx
      environment: production

- job_name: syslog
  syslog:
    listen_address: 0.0.0.0:1514
    label_structured_data: yes
    labels:
      job: syslog
      service: system
  relabel_configs:
    - source_labels: ['__syslog_message']
      regex: '.*'
      target_label: 'message'

- job_name: docker
  docker_sd_configs:
    - host: unix:///var/run/docker.sock
      refresh_interval: 5s
  relabel_configs:
    - source_labels: ['__meta_docker_container_name']
      regex: '/(.*)'
      target_label: 'container'
    - source_labels: ['__meta_docker_container_log_stream']
      regex: 'stdout'
      action: keep
