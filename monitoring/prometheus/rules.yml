groups:
  - name: markzap_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) by (instance)) > 80
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% (threshold: 85%)"

      # Application down
      - alert: ApplicationDown
        expr: up{job="markzap-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: application
        annotations:
          summary: "MarkZap application is down"
          description: "No response from markzap-app on {{ $labels.instance }} for 1 minute"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[2m])) > 1
        for: 5m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "High response time for {{ $labels.endpoint }}"
          description: "95th percentile response time is {{ $value }}s (threshold: 1s)"

      # Error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: application
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value }}% (threshold: 5%)"

      # Database connections high
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High database connections"
          description: "PostgreSQL connections: {{ $value }} (threshold: 80)"

      # Disk space low
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Available disk space: {{ $value }}%"

      # Certificate expiring soon
      - alert: CertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: warning
          service: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "Certificate for {{ $labels.instance }} expires in less than 7 days"

      # High 5xx rate
      - alert: High5xxRate
        expr: rate(http_requests_total{status=~"5.."}[1m]) > 0.1
        for: 2m
        labels:
          severity: critical
          service: application
        annotations:
          summary: "High 5xx error rate"
          description: "5xx rate: {{ $value }} req/s"

      # Service latency
      - alert: ServiceLatencyHigh
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[2m])) > 3
        for: 5m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "Service latency high"
          description: "99th percentile latency: {{ $value }}s"
