route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'slack-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: false
    - match:
        severity: warning
      receiver: 'slack-notifications'

receivers:
  # Slack notifications
  - name: 'slack-notifications'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }}'
        text: |
          *Alert:* {{ .CommonLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Service:* {{ .CommonLabels.service }}
          *Instance:* {{ .CommonLabels.instance }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Started:* {{ .StartsAt }}

  # PagerDuty for critical alerts
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_INTEGRATION_KEY'
        severity: 'critical'
        component: '{{ .CommonLabels.service }}'
        group: 'markzap-production'
        class: '{{ .CommonLabels.alertname }}'
        custom_details:
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'
          instance: '{{ .CommonLabels.instance }}'

  # Email notifications
  - name: 'email-notifications'
    email_configs:
      - to: 'alerts@markzap.online'
        from: 'alertmanager@markzap.online'
        smarthost: 'smtp.gmail.com:587'
        auth_identity: 'alertmanager@markzap.online'
        auth_password: 'YOUR_EMAIL_PASSWORD'
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} for {{ .CommonLabels.cluster }}'

  # Webhook for custom integrations
  - name: 'webhook'
    webhook_configs:
      - url: 'https://api.twilio.com/2010-04-01/Accounts/YOUR_ACCOUNT/Messages.json'
        send_resolved: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'
