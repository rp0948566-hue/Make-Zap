# Docker Compose for local development and production
version: '3.8'

services:
  # Main application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: markzap-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./logs:/app/logs
      - ./backup:/app/backup
    networks:
      - markzap-network
    depends_on:
      - postgres
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.markzap.rule=Host(`markzap.online`) || Host(`www.markzap.online`)"
      - "traefik.http.routers.markzap.entrypoints=websecure"
      - "traefik.http.routers.markzap.tls=true"
      - "traefik.http.routers.markzap.tls.certresolver=letsencrypt"
      - "traefik.http.services.markzap.loadbalancer.server.port=3000"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: markzap-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=markzap
      - POSTGRES_USER=markzap
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - markzap-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markzap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: markzap-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - markzap-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traefik Load Balancer (optional - for production)
  # Uncomment for production with SSL
  # traefik:
  #   image: traefik:v3.0
  #   container_name: markzap-traefik
  #   restart: unless-stopped
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--providers.docker.exposedbydefault=false"
  #     - "--entrypoints.web.address=:80"
  #     - "--entrypoints.websecure.address=:443"
  #     - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
  #     - "--certificatesresolvers.letsencrypt.acme.email=security@markzap.online"
  #     - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"  # Dashboard
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./letsencrypt:/letsencrypt
  #   networks:
  #     - markzap-network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: markzap-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - markzap-network
    ports:
      - "9090:9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.markzap.local`)"
      - "traefik.http.routers.prometheus.entrypoints=web"

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: markzap-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - markzap-network
    ports:
      - "3001:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.markzap.local`)"
      - "traefik.http.routers.grafana.entrypoints=web"

  # Loki for logs
  loki:
    image: grafana/loki:latest
    container_name: markzap-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki_data:/loki
    networks:
      - markzap-network
    ports:
      - "3100:3100"

  # Promtail for log collection
  promtail:
    image: grafana/promtail:latest
    container_name: markzap-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log
      - ./monitoring/promtail:/etc/promtail
    networks:
      - markzap-network
    command: -config.file=/etc/promtail/config.yml

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  markzap-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
